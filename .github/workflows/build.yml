name: Build

# Checks and packages every commit on main and every pull request. The
# packaged extension is kept with the run as a downloadable .xpi.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Version numbers, types and the extension linter.
      - run: npm run check

      - run: npm run package

      # Uploaded as it is rather than inside a zip, so that the download is
      # the .xpi itself.
      - uses: actions/upload-artifact@v7
        with:
          path: web-ext-artifacts/*.xpi
          archive: false
          if-no-files-found: error
